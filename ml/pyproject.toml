[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ml"
version = "0.1.0"
description = "Forest Sentinel — satellite pipeline and change-detection models"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.3.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pystac-client>=0.8",
  "opencv-python-headless>=4.9",
  "pillow>=10",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet access to public STAC/COG endpoints"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
