# Forest Sentinel — pila local / staging.
# Uso:  ./scripts/setup.ps1  (o ./scripts/setup.sh)  y luego  docker compose --profile full up --build
# Los puertos solo escuchan en 127.0.0.1; en producción pon un proxy TLS delante.
# Puertos cambiables desde .env: WEB_PORT, API_PORT, POSTGRES_PORT, REDIS_PORT, MAILPIT_UI_PORT, MAILPIT_SMTP_PORT.

name: forest-sentinel

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    DATA_DIR: /data
    # Dentro de Docker el correo siempre va a Mailpit (el SMTP_HOST del .env es para ejecutar sin Docker).
    # Para un SMTP real en contenedores, define DOCKER_SMTP_HOST en .env.
    SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
    # A la API solo se llega por la red interna (proxy web / proxy TLS),
    # entonces confiamos en el X-Forwarded-For de esos saltos para el rate limiting por cliente.
    FORWARDED_ALLOW_IPS: "*"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # Por TCP y no por socket: en el primer arranque la imagen levanta un Postgres temporal
      # (solo socket) para instalar PostGIS y lo reinicia; por socket parecería listo antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 20

  # SMTP de desarrollo: todo correo queda capturado y se puede ver en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    profiles: ["dev", "full"]

  # Una sola ejecución por arranque: migraciones + datos iniciales. Ambas son idempotentes
  # (alembic solo aplica lo pendiente; el seed no duplica territorios, fuentes ni administrador).
  migrate:
    build: *backend-build
    <<: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    healthcheck: { disable: true }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["full"]

  api:
    build: *backend-build
    <<: *backend-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - satdata:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["full"]

  worker:
    build: *backend-build
    <<: *backend-env
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--max-tasks-per-child=20"]
    # El HEALTHCHECK de la imagen consulta la API (puerto 8000); el worker se comprueba con Celery.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - satdata:/data
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["full"]

  beat:
    build: *backend-build
    <<: *backend-env
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["full"]

  web:
    build:
      context: frontend
      args:
        API_ORIGIN: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    profiles: ["full"]

volumes:
  pgdata:
  redisdata:
  satdata:
