name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -e "ml[dev]" opencv-python-headless
      - name: Unit tests (no network)
        run: cd ml && pytest -q -m "not network"

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: forest, POSTGRES_PASSWORD: forest-ci-only, POSTGRES_DB: forest_sentinel }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U forest" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://forest:forest-ci-only@127.0.0.1:5433/forest_sentinel
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -e ml opencv-python-headless pillow
          pip install -e "backend[dev]"
      - name: Lint
        run: cd backend && ruff check app
      - name: Migrations up/down/up
        run: cd backend && alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests
        run: cd backend && pytest -q
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --skip-editable || true

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
